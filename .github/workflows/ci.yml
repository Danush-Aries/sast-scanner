name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Python lint & tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run syntax check on all Python files
        run: python -m py_compile scanner/*.py sast_scanner.py

      - name: Run unit tests (AI explainer disabled)
        env:
          DISABLE_AI_EXPLAINER: "true"
        run: python -m pytest tests/ -v --tb=short
        continue-on-error: true   # tests directory may not exist yet

  frontend-build:
    name: Frontend build check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: web/frontend
        run: npm ci

      - name: TypeScript type-check
        working-directory: web/frontend
        run: npx tsc --noEmit

      - name: Build frontend
        working-directory: web/frontend
        run: npm run build
