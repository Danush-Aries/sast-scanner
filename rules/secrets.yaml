rules:
  - id: hardcoded-secret
    patterns:
      - pattern-either:
          - pattern: "$KEY = \"$VAL\""
          - pattern: "$KEY = '$VAL'"
      - metavariable-regex:
          metavariable: $KEY
          regex: '(?i)(password|secret|api_key|token|auth_token|access_key|private_key)'
      - pattern-not: "$KEY = \"\""
      - pattern-not: "$KEY = ''"
      - pattern-not: "$KEY = None"
    message: "Hardcoded secret detected in variable assignment. Use environment variables or a secret manager."
    severity: ERROR
    languages: [python]
