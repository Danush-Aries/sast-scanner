rules:
  - id: command-injection
    patterns:
      - pattern-either:
          - pattern: "os.system($S)"
          - pattern: "os.popen($S)"
          - pattern: "subprocess.Popen($S, shell=True, ...)"
          - pattern: "subprocess.call($S, shell=True, ...)"
          - pattern: "subprocess.run($S, shell=True, ...)"
          - pattern: "subprocess.check_output($S, shell=True, ...)"
      - metavariable-regex:
          metavariable: $S
          regex: '.*(f""".*|f".*|f''.*|\.format\(.*|\s*\+\s*|%\s*\().*'
    message: >
      Command injection risk: shell=True or shell commands are used with a
      dynamically-constructed argument. Pass a list of arguments with
      shell=False instead of building a shell string.
    severity: ERROR
    languages: [python]
