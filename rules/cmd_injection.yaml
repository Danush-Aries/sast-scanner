rules:
  - id: command-injection
    patterns:
      - pattern-either:
          - pattern: "os.system($S)"
          - pattern: "os.popen($S)"
          - pattern: "subprocess.Popen($S, shell=True, ...)"
          - pattern: "subprocess.call($S, shell=True, ...)"
          - pattern: "subprocess.run($S, shell=True, ...)"
          - pattern: "subprocess.check_output($S, shell=True, ...)"
      - pattern-not: "os.system($S)" # Placeholder for constant string check if needed, but Semgrep handles literals better via metavariables
      - metavariable-regex:
          metavariable: $S
          regex: '.*(f"".*|"".* \+ .*|%.*).*'
    message: "Command injection detected: shell=True or shell commands are used with dynamic input. Use a list of arguments with shell=False."
    severity: ERROR
    languages: [python]
